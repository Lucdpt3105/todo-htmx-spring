<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="'Error ' + ${status} + ' — Todo App'">Error — Todo App</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center">
  <div class="max-w-lg mx-auto px-6 py-16 text-center">
    <div class="text-8xl font-black text-gray-700 mb-4" th:text="${status}">500</div>
    <h1 class="text-2xl font-bold mb-3 text-gray-100" th:text="${error}">Internal Server Error</h1>
    <p class="text-gray-400 mb-8" th:text="${message}">Something went wrong.</p>
    <a
      href="/"
      class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition-colors"
    >
      ← Back to Home
    </a>
  </div>
</body>
</html>
