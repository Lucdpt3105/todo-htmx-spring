version: '3.8'

# ─────────────────────────────────────────────
#  LOCAL DEV: chỉ chạy PostgreSQL
#  $ docker compose up -d postgres
#  Sau đó chạy app bằng IDE / mvn spring-boot:run
#
#  FULL STACK: build + chạy cả app lẫn DB
#  $ docker build -t todo-app:latest .
#  $ docker compose --profile full up -d
# ─────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-todos
    environment:
      POSTGRES_DB: todos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: ["full"]
    image: todo-app:latest
    container_name: todo-app
    environment:
      # Dùng postgresql:// (không phải postgres://) khi kết nối nội bộ Docker
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/todos?sslmode=disable
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
